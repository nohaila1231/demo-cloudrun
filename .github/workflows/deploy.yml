name: Deploy to Cloud Run

on:
  push:
    branches:
      - "**"

env:
  PROJECT_ID: devops-sqli-projet
  REGION: europe-west1
  REPOSITORY: westfield-frontend
  SERVICE: demo-cloudrun

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}

      - name: Build Secret String
        id: secrets
        shell: bash
        run: |
          secrets_vars=$(paste -sd, .github/cloud-run/.demo.secrets.prod)
          echo "secrets_vars=$secrets_vars" >> "$GITHUB_OUTPUT"

      - name: Build Environment Variables
        id: envvars
        shell: bash
        run: |
          env_vars=$(paste -sd, .github/cloud-run/.demo.env.prod)
          echo "env_vars=$env_vars" >> "$GITHUB_OUTPUT"

      - name: Prepare branch name
        id: branch
        shell: bash
        run: |
          # Nettoyer le nom de la branche : remplacer / . _ et autres caractères spéciaux par des tirets
          # Puis supprimer les tirets multiples et les tirets en début/fin
          BRANCH=$(echo "${GITHUB_REF_NAME}" | \
            sed 's/[^a-zA-Z0-9]/-/g' | \
            sed 's/--*/-/g' | \
            sed 's/^-//;s/-$//' | \
            tr '[:upper:]' '[:lower:]')
          
          # Limiter la longueur à 63 caractères (limite Cloud Run)
          BRANCH=$(echo "${BRANCH}" | cut -c1-63)
          
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Cleaned branch name: $BRANCH" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          env_vars: ${{ steps.envvars.outputs.env_vars }}
          secrets: ${{ steps.secrets.outputs.secrets_vars }}
          suffix: ${{ steps.branch.outputs.branch_name }}-${{ github.run_number }}
          tag: ${{ steps.branch.outputs.branch_name }}
          flags: >-
            --service-account=next-runtime@devops-sqli-projet.iam.gserviceaccount.com
            --allow-unauthenticated

      - name: Show Cloud Run URL
        run: |
          echo "Application URL:"
          echo "${{ steps.deploy.outputs.url }}"